name: Release Extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' '*.cjs' ':!:echarts.min.js' | xargs -0 -r -n 1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.cjs

  package-and-release:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          version="$(python3 -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=surfing-statistics-chrome-extension-${version}-build.${GITHUB_RUN_NUMBER}.zip" >> "$GITHUB_OUTPUT"

      - name: Create extension package
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.manifest.outputs.artifact_name }}" \
            manifest.json \
            background.js \
            content.js \
            llm.js \
            stats.js \
            popup.html \
            popup.js \
            options.html \
            options.js \
            echarts.min.js \
            images

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/${{ steps.manifest.outputs.artifact_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.release_tag }}
          name: ${{ steps.manifest.outputs.release_tag }}
          generate_release_notes: true
          files: dist/${{ steps.manifest.outputs.artifact_name }}


